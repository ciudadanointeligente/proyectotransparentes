# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Redirects de URLs antiguas (HTML plano) a URLs nuevas
# NETLIFY_REDIRECTS imprimibles: la primera regla que coincide gana.

# Portada y páginas estáticas
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/el-proyecto.html"
  to = "/el-proyecto/"
  status = 301

[[redirects]]
  from = "/seguimiento-legislativo.html"
  to = "/seguimiento-legislativo/"
  status = 301

# Listados por tema (eran 5 archivos duplicados)
[[redirects]]
  from = "/transparencia.html"
  to = "/seguimiento-legislativo/transparencia/"
  status = 301

[[redirects]]
